# play.yctechnologies.com.tr: static build of Gridlock.
# Cloudflare (proxied) -> nginx :443 -> /var/www/gridlock/current (a symlink to the active release).

server {
    listen 80;
    listen [::]:80;
    server_name play.yctechnologies.com.tr;
    return 301 https://play.yctechnologies.com.tr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name play.yctechnologies.com.tr;

    ssl_certificate /etc/ssl/certs/yctechnologies.crt;
    ssl_certificate_key /etc/ssl/private/yctechnologies.key;

    root /var/www/gridlock/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    autoindex off;
    client_max_body_size 1k;

    # A static game only ever needs GET and HEAD.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml;

    # Content-hashed bundles never change: cache them forever.
    location /assets/ {
        include /etc/nginx/snippets/gridlock-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML must be revalidated so a deploy is picked up immediately.
    location / {
        include /etc/nginx/snippets/gridlock-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # No dotfiles, ever.
    location ~ /\. {
        return 404;
    }
}
